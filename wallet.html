<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descarga la Wallet GameLobby</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a121e">
<link rel="icon" href="assets/logo-symbol.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,system-ui,sans-serif;background:radial-gradient(90% 70% at 50% 0%,rgba(0,171,235,.25),transparent 60%),#0a121e;color:#fff;padding:24px}
  main{max-width:380px;text-align:center}
  img.logo{width:72px;height:72px}
  h1{font-size:26px;line-height:1.2;margin:18px 0 8px}
  p{color:#b9c3d6;margin:0 0 26px;line-height:1.55}
  .stores{display:grid;gap:12px}
  a.store{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 18px;border-radius:14px;background:#000;border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-weight:600}
  a.store:focus-visible,a.store:hover{border-color:#00abeb}
  a.store svg{width:24px;height:24px}
  small{display:block;margin-top:22px;color:#6f7d96;font-size:12px}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-symbol.png" alt="GameLobby">
  <h1>Descarga la Wallet GameLobby</h1>
  <p>Inscripciones, pagos y premios desde tu celular, sin efectivo.</p>
  <div class="stores">
    <a class="store" id="ios" href="#"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.53 2.66-.39 6.59 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.3-3.51zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.68-.92 2.67.97.08 1.96-.49 2.56-1.22z"/></svg>App Store</a>
    <a class="store" id="android" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#00d7fe" d="M3.6 2.3 13.4 12l-9.8 9.7c-.35-.2-.6-.6-.6-1.1V3.4c0-.5.25-.9.6-1.1z"/><path fill="#00f076" d="m16.8 8.6-3.4 3.4-9.8-9.7c.3-.2.8-.2 1.2 0z"/><path fill="#ff3a44" d="m16.8 15.4-12 6.3c-.4.2-.9.2-1.2 0l9.8-9.7z"/><path fill="#ffd500" d="m20.4 10.5-3.6-1.9-3.4 3.4 3.4 3.4 3.6-1.9c.9-.5.9-1.5 0-2z"/></svg>Google Play</a>
  </div>
  <small>gamelobby.live</small>
</main>
<script>
  // Enlaces oficiales de las tiendas. Pegar aquí las URLs de la ficha de la app
  // (App Store: https://apps.apple.com/app/id…  ·  Google Play: https://play.google.com/store/apps/details?id=…).
  // Mientras estén vacías, los botones abren la búsqueda "GameLobby" en cada tienda y no hay redirección automática.
  var IOS_URL = '';
  var ANDROID_URL = '';

  var iosHref = IOS_URL || 'https://apps.apple.com/search?term=GameLobby';
  var andHref = ANDROID_URL || 'https://play.google.com/store/search?q=GameLobby&c=apps';
  document.getElementById('ios').href = iosHref;
  document.getElementById('android').href = andHref;

  var q = new URLSearchParams(location.search);
  var ua = navigator.userAgent || '';
  var os = q.get('os') || (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document) ? 'ios' : /Android/i.test(ua) ? 'android' : '');
  try { if (typeof window.va === 'function') window.va('event', { name: 'wallet_download', data: { os: os || 'desktop', src: q.get('utm_source') || '' } }); } catch (e) {}
  if (os === 'ios' && IOS_URL) location.replace(IOS_URL);
  else if (os === 'android' && ANDROID_URL) location.replace(ANDROID_URL);
</script>
<script defer src="/_vercel/insights/script.js"></script>

</html>
